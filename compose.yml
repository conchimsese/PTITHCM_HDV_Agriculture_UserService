services:
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-user_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  user-service:
    profiles: [app]
    build: .
    environment:
      SERVER_PORT: 8081
      MEDIA_STORAGE_DIR: /var/lib/user-media
      KAFKA_BOOTSTRAP_SERVERS: user-kafka:19092
      OUTBOX_KAFKA_ENABLED: ${OUTBOX_KAFKA_ENABLED:-false}
      OUTBOX_EMAIL_ENABLED: ${OUTBOX_EMAIL_ENABLED:-false}
      PROFILE_BOOTSTRAP_ENABLED: ${PROFILE_BOOTSTRAP_ENABLED:-false}
      REPUTATION_CONSUMER_ENABLED: ${REPUTATION_CONSUMER_ENABLED:-false}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USERNAME: ${DB_USERNAME:-user_service}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      INTERNAL_GATEWAY_KEY: ${INTERNAL_GATEWAY_KEY:-}
      INTERNAL_FARMING_KEY: ${INTERNAL_FARMING_KEY:-}
      INTERNAL_TRADING_KEY: ${INTERNAL_TRADING_KEY:-}
      INTERNAL_CHAT_KEY: ${INTERNAL_CHAT_KEY:-}
      INTERNAL_PAYMENT_KEY: ${INTERNAL_PAYMENT_KEY:-}
      INTERNAL_NOTIFICATION_KEY: ${INTERNAL_NOTIFICATION_KEY:-}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-}
      JWT_PRIVATE_KEY_PATH: /run/user-secrets/private.pem
      JWT_PUBLIC_KEY_PATH: /run/user-secrets/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      MAIL_HOST: user-mail
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-user-service@localhost}
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_1_USERNAME: ${ADMIN_1_USERNAME:-}
      ADMIN_1_EMAIL: ${ADMIN_1_EMAIL:-}
      ADMIN_1_PASSWORD: ${ADMIN_1_PASSWORD:-}
      ADMIN_2_USERNAME: ${ADMIN_2_USERNAME:-}
      ADMIN_2_EMAIL: ${ADMIN_2_EMAIL:-}
      ADMIN_2_PASSWORD: ${ADMIN_2_PASSWORD:-}
    volumes:
      - ./secrets/local-auth:/run/user-secrets:ro
      - user-media-data:/var/lib/user-media
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      user-db:
        condition: service_healthy
  user-kafka:
    profiles: [messaging]
    image: apache/kafka-native:3.9.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://user-kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@user-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Local single-broker fixture only; provision topics/security explicitly in deployment.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  user-mail:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  user-db-data:
  user-media-data:
